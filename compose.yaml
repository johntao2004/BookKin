name: silvae

x-silvae-common: &silvae-common
  image: ${SILVAE_IMAGE:-silvae:local}
  build:
    context: .
    dockerfile: docker/silvae.Dockerfile
  restart: unless-stopped
  user: "${SILVAE_UID:-1000}:${SILVAE_GID:-1000}"
  environment: &silvae-environment
    SILVAE_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-silvae}
    SILVAE_DATABASE_USER: ${POSTGRES_USER:-silvae}
    SILVAE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    SILVAE_COOKIE_SECURE: ${SILVAE_SESSION_COOKIE_SECURE:-false}
    SILVAE_PUBLIC_BASE_URL: ${SILVAE_PUBLIC_BASE_URL:-http://localhost:8080}
    # No insecure default. Leave empty only while AI is disabled; enabling or
    # saving a provider key requires a stable instance-specific value.
    SILVAE_AI_SETTINGS_ENCRYPTION_KEY: ${SILVAE_AI_SETTINGS_ENCRYPTION_KEY:-}
    SILVAE_STORAGE_ROOTS_0_NAME: ${SILVAE_LIBRARY_NAME:-主书库}
    SILVAE_STORAGE_ROOTS_0_PATH: /library/main
    SILVAE_CONTENT_STORAGE_PATH: /var/lib/silvae/content
    TZ: ${TZ:-Asia/Shanghai}
  volumes:
    - type: bind
      source: ${SILVAE_LIBRARY_MAIN:-./.local/library}
      target: /library/main
    - type: bind
      source: ${SILVAE_FONT_STORAGE:-./.local/fonts}
      target: /var/lib/silvae/fonts
    - type: bind
      source: ${SILVAE_ARTICLE_STORAGE:-./.local/content/articles}
      target: /var/lib/silvae/content/articles
    - type: bind
      source: ${SILVAE_VAULT_STORAGE:-./.local/content/vault}
      target: /var/lib/silvae/content/vault
  tmpfs:
    - /tmp/silvae:size=512m,mode=1777
  security_opt:
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *silvae-common
    environment:
      <<: *silvae-environment
      SPRING_PROFILES_ACTIVE: api
      SILVAE_TWO_FACTOR_ENCRYPTION_KEY: ${SILVAE_TWO_FACTOR_ENCRYPTION_KEY:-}
      SILVAE_API_PORT: 8080
    ports:
      - "${SILVAE_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  worker:
    <<: *silvae-common
    environment:
      <<: *silvae-environment
      SPRING_PROFILES_ACTIVE: worker
    healthcheck:
      disable: true

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-silvae}
      POSTGRES_USER: ${POSTGRES_USER:-silvae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - silvae-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-silvae} -d ${POSTGRES_DB:-silvae}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  silvae-postgres:
