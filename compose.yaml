name: bookkin

x-bookkin-common: &bookkin-common
  image: bookkin:local
  build:
    context: .
    dockerfile: docker/bookkin.Dockerfile
  restart: unless-stopped
  user: "${BOOKKIN_UID:-1000}:${BOOKKIN_GID:-1000}"
  environment: &bookkin-environment
    BOOKKIN_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bookkin}
    BOOKKIN_DATABASE_USER: ${POSTGRES_USER:-bookkin}
    BOOKKIN_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    BOOKKIN_COOKIE_SECURE: ${BOOKKIN_SESSION_COOKIE_SECURE:-false}
    BOOKKIN_PUBLIC_BASE_URL: ${BOOKKIN_PUBLIC_BASE_URL:-http://localhost:8080}
    BOOKKIN_STORAGE_ROOTS_0_NAME: ${BOOKKIN_LIBRARY_NAME:-主书库}
    BOOKKIN_STORAGE_ROOTS_0_PATH: /library/main
    TZ: ${TZ:-Asia/Shanghai}
  volumes:
    - type: bind
      source: ${BOOKKIN_LIBRARY_MAIN:-./.local/library}
      target: /library/main
    - type: bind
      source: ${BOOKKIN_FONT_STORAGE:-./.local/fonts}
      target: /var/lib/bookkin/fonts
  tmpfs:
    - /tmp/bookkin:size=512m,mode=1777
  security_opt:
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *bookkin-common
    environment:
      <<: *bookkin-environment
      SPRING_PROFILES_ACTIVE: api
      BOOKKIN_API_PORT: 8080
    ports:
      - "${BOOKKIN_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  worker:
    <<: *bookkin-common
    environment:
      <<: *bookkin-environment
      SPRING_PROFILES_ACTIVE: worker
    healthcheck:
      disable: true

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookkin}
      POSTGRES_USER: ${POSTGRES_USER:-bookkin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - bookkin-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookkin} -d ${POSTGRES_DB:-bookkin}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  bookkin-postgres:
