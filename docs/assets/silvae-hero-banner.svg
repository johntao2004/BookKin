<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 272" width="100%" height="100%" role="img" aria-label="Silvae · 书林 — 让好书相聚，让阅读归于自己">
  <!-- 100% Pure Flat Warm Paper Canvas (cream100: #FAF9F5, hairline: #E6DFD8) -->
  <rect width="1200" height="272" rx="22" fill="#FAF9F5" stroke="#E6DFD8" stroke-width="1.5" />

  <!-- Option 3 Emblem: Guofeng "如意卷轴 · 藏书方印" (Ruyi Cloud-Scroll & Solid Cinnabar Seal) -->
  <g transform="translate(600, 74)">
    <!-- Flat Cream-200 Squircle Tile -->
    <rect x="-44" y="-44" width="88" height="88" rx="20" fill="#F5F0E8" stroke="#E6DFD8" stroke-width="1.5" />

    <g transform="scale(0.086)">
      <!-- Top Ruyi Scroll Curve -->
      <path d="M -138 -36
               C -265 -36, -336 -125, -336 -226
               C -336 -336, -248 -384, -120 -384
               H 176
               C 288 -384, 344 -312, 344 -226
               C 344 -148, 282 -112, 224 -128
               C 188 -138, 178 -176, 208 -196"
            fill="none" stroke="#1F1E1B" stroke-width="82" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Bottom Ruyi Scroll Curve (180° Rotationally Symmetric) -->
      <path d="M 138 36
               C 265 36, 336 125, 336 226
               C 336 336, 248 384, 120 384
               H -176
               C -288 384, -344 312, -344 226
               C -344 148, -282 112, -224 128
               C -188 138, -178 176, -208 196"
            fill="none" stroke="#1F1E1B" stroke-width="82" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Top & Bottom Inner Ruyi C-Scroll Accents -->
      <path d="M -206 -236 C -162 -236, -162 -140, -206 -140"
            fill="none" stroke="#1F1E1B" stroke-width="72" stroke-linecap="round" />
      <path d="M 206 236 C 162 236, 162 140, 206 140"
            fill="none" stroke="#1F1E1B" stroke-width="72" stroke-linecap="round" />

      <!-- Top & Bottom Horizontal Bamboo-Slip Pill Bars -->
      <line x1="-82" y1="-168" x2="82" y2="-168" stroke="#1F1E1B" stroke-width="68" stroke-linecap="round" />
      <line x1="-82" y1="168" x2="82" y2="168" stroke="#1F1E1B" stroke-width="68" stroke-linecap="round" />

      <!-- Center Solid Rounded-Square Cinnabar Library Seal (藏书朱印, #CC785C) -->
      <rect x="-102" y="-102" width="204" height="204" rx="38" fill="#CC785C" />
    </g>
  </g>

  <!-- Flat Editorial Wordmark & Rounded Coral Seal Badge -->
  <g transform="translate(600, 174)" text-anchor="middle">
    <text x="-22" y="0" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, 'Noto Serif SC', serif" font-size="48" font-weight="500" letter-spacing="5" fill="#141413">Silvae</text>
    <g transform="translate(102, -31)">
      <rect x="0" y="0" width="48" height="24" rx="7" fill="#CC785C" />
      <text x="24" y="16.5" font-family="'Noto Serif SC', 'Songti SC', 'PingFang SC', serif" font-size="13" font-weight="600" letter-spacing="2" fill="#FFFDF8" text-anchor="middle">书林</text>
    </g>
  </g>

  <!-- Flat 1px Hairline Divider -->
  <line x1="440" y1="200" x2="760" y2="200" stroke="#E6DFD8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Editorial Chinese Tagline -->
  <text x="600" y="236" text-anchor="middle" font-family="'Noto Serif SC', 'Songti SC', 'PingFang SC', serif" font-size="19.5" font-weight="500" letter-spacing="3" fill="#252523">
    让好书相聚，让阅读归于自己
  </text>
</svg>
