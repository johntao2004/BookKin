services:
  app:
    environment:
      SILVAE_STORAGE_ROOTS_1_NAME: 旧书归档
      SILVAE_STORAGE_ROOTS_1_PATH: /library/archive
    volumes:
      - type: bind
        source: ${SILVAE_LIBRARY_ARCHIVE:?set SILVAE_LIBRARY_ARCHIVE in .env}
        target: /library/archive
  worker:
    environment:
      SILVAE_STORAGE_ROOTS_1_NAME: 旧书归档
      SILVAE_STORAGE_ROOTS_1_PATH: /library/archive
    volumes:
      - type: bind
        source: ${SILVAE_LIBRARY_ARCHIVE:?set SILVAE_LIBRARY_ARCHIVE in .env}
        target: /library/archive
